name: Build and Deploy Affiliate Site
on:
  push:
    branches: [ main ]
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
- name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manual Theme Install
        run: |
          rm -rf themes/ananke
          git clone https://github.com/theNewDynamic/hugo-theme-ananke.git themes/ananke

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AI Dependencies
        run: pip install openai

      - name: Run AI Blog Generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_blog.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
